name: Deploy to production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate files
        run: |
          set -Eeuo pipefail

          test -f index.html
          test -f package.json
          test -d css
          test -d js
          test -d assets
          test -d tests

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate version metadata
        run: |
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const packageJson = JSON.parse(readFileSync('package.json', 'utf8')); const payload = { version: packageJson.version, deployedAt: new Date().toISOString().replace(/\.\d{3}Z$/, 'Z'), commit: process.env.GITHUB_SHA.slice(0, 7) }; writeFileSync('dist/version.json', JSON.stringify(payload, null, 2) + '\n');"

      - name: Verify build output
        run: |
          set -Eeuo pipefail

          test -f dist/index.html
          test -f dist/version.json
          test -d dist/css
          test -d dist/js
          test -d dist/assets

      - name: Prepare SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -Eeuo pipefail

          test -n "$SSH_USER" || {
            echo "::error::SSH_USER puuttuu"
            exit 1
          }

          test -n "$SSH_HOST" || {
            echo "::error::SSH_HOST puuttuu"
            exit 1
          }

          test -n "$DEPLOY_PATH" || {
            echo "::error::DEPLOY_PATH puuttuu"
            exit 1
          }

          test -n "$SSH_KEY" || {
            echo "::error::SSH_KEY puuttuu"
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"

          ssh-keyscan \
            -T 10 \
            -p 22 \
            -H "$SSH_HOST" > "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            "echo SSH connection successful"

      - name: Transfer files
        shell: bash
        run: |
          set -Eeuo pipefail

          rsync \
            --archive \
            --verbose \
            --compress \
            --human-readable \
            --delete \
            -e "ssh -i $RUNNER_TEMP/deploy_key -p 22 -o BatchMode=yes -o ConnectTimeout=15 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Verify deployment
        shell: bash
        run: |
          set -Eeuo pipefail

          APP_VERSION="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version);")"
          SHORT_SHA="${GITHUB_SHA::7}"
          APP_VERSION_JSON="$(node --input-type=module -e "process.stdout.write(JSON.stringify(process.argv[1]));" "$APP_VERSION")"
          SHORT_SHA_JSON="$(node --input-type=module -e "process.stdout.write(JSON.stringify(process.argv[1]));" "$SHORT_SHA")"

          REMOTE_SCRIPT='set -Eeuo pipefail
          test -f "$DEPLOY_PATH/index.html"
          find "$DEPLOY_PATH" -type f -exec chmod 644 {} +
          DEPLOYED_AT_UTC="$(date -u +'\''%Y-%m-%dT%H:%M:%SZ'\'')"
          VERSION_TMP_PATH="$DEPLOY_PATH/version.json.tmp"
          printf '\''{\n  "version": %s,\n  "deployedAt": "%s",\n  "commit": %s\n}\n'\'' "$APP_VERSION_JSON" "$DEPLOYED_AT_UTC" "$SHORT_SHA_JSON" > "$VERSION_TMP_PATH"
          chmod 644 "$VERSION_TMP_PATH"
          mv "$VERSION_TMP_PATH" "$DEPLOY_PATH/version.json"
          test -f "$DEPLOY_PATH/version.json"'

          printf '%s\n' "$REMOTE_SCRIPT" | ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -p 22 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" \
            APP_VERSION_JSON="$APP_VERSION_JSON" SHORT_SHA_JSON="$SHORT_SHA_JSON" DEPLOY_PATH="$DEPLOY_PATH" \
            'bash -s'

          echo "Deployment completed successfully."
